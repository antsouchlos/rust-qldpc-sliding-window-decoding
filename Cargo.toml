[package]
name = "rust-qldpc"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }                                                                                                                             

[profile.release]
debug = true

[[bench]]                                                                                                                                                                                
name = "decode"
harness = false

[lib]
name = "rust_qldpc"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.28.0"
sprs = "0.11.4"

[dependencies.pyo3]
version = "0.28.3"
features = ["abi3-py38"]
